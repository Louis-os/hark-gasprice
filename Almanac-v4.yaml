name: 黄历（油价配色版）
description: 黄历宜忌、干支生肖、冲煞、节气、教学周次，油价小组件同款三段渐变 + 自适应深浅配色
env_schema:
  ASTRO_OR_WEEK:
    name: 顶部显示
    description: 填 astro 显示星座，填 week 显示教学周次
    default_value: ''
  SHOW_TEACHING_WEEK:
    name: 显示教学周次
    description: 是否显示教学周次（true/false）
    default_value: 'true'
  TEACHING_WEEK_START:
    name: 教学周起始日期
    description: 教学第一周的起始日期，格式如 2026-09-01
    default_value: ''
scriptings:
  - generic:
      name: 黄历-油价版
      script_url: https://raw.githubusercontent.com/Louis-os/hark-gasprice/refs/heads/main/Almanac-v4.js?v=20261014a
      timeout: 30
widgets:
  - name: 黄历-油价版
    script_name: 黄历-油价版
